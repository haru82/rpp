<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>카카오톡 - HJ 과장님</title>
    <style>
        body { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; background-color: #e0e0e0; margin: 0; display: flex; justify-content: center; height: 100vh; }
        .mobile-container { width: 100%; max-width: 450px; height: 100vh; background-color: #b2c7d9; display: flex; flex-direction: column; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        
        #api-key-area { background: #333; padding: 5px; text-align: center; font-size: 11px; color: #ccc; z-index: 10; }
        #api-key-area input { padding: 3px; width: 150px; border-radius: 4px; border: none; margin-left: 5px; font-size: 11px; }

        .header { background-color: #b2c7d9; padding: 15px; font-weight: bold; text-align: center; font-size: 16px; border-bottom: 1px solid rgba(0,0,0,0.05); color: #333; display: flex; justify-content: space-between; align-items: center; }
        .header .back-btn { font-size: 20px; cursor: pointer; color: #333; }
        .header .title { flex: 1; text-align: center; }

        #chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .system-msg { background-color: rgba(0,0,0,0.1); color: #fff; font-size: 12px; padding: 5px 15px; border-radius: 15px; align-self: center; margin-bottom: 10px; }

        .message-row { display: flex; width: 100%; align-items: flex-start; }
        .message-row.ai { flex-direction: row; }
        .message-row.user { flex-direction: row-reverse; }

        .profile-pic { width: 40px; height: 40px; border-radius: 15px; background-color: #fff; margin-right: 10px; margin-left: 10px; background-image: url('https://cdn-icons-png.flaticon.com/512/4140/4140047.png'); background-size: cover; flex-shrink: 0; }
        .user .profile-pic { display: none; }

        .message-content { max-width: 70%; display: flex; flex-direction: column; }
        .user .message-content { align-items: flex-end; }
        
        .sender-name { font-size: 12px; color: #555; margin-bottom: 4px; margin-left: 2px; }
        .user .sender-name { display: none; }

        .bubble { padding: 10px 12px; border-radius: 12px; font-size: 14px; line-height: 1.5; word-wrap: break-word; position: relative; }
        .ai .bubble { background-color: #ffffff; border-top-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .user .bubble { background-color: #FEE500; border-top-right-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }

        #input-area { display: flex; padding: 10px; background-color: #ffffff; border-top: 1px solid #e0e0e0; }
        #user-input { flex: 1; padding: 12px; border: none; background-color: #f5f5f5; border-radius: 20px; outline: none; font-size: 14px; margin-right: 10px; }
        #send-btn { padding: 0 20px; background-color: #FEE500; color: #333; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

<div class="mobile-container">
    <div id="api-key-area">
        Gemini API Key: <input type="password" id="api-key" placeholder="AIza로 시작하는 키 입력">
    </div>
    
    <div class="header">
        <span class="back-btn">⟨</span>
        <span class="title">HJ 과장님</span>
        <span style="width:20px;"></span>
    </div>

    <div id="chat-box">
        <div class="system-msg">HJ 과장님에게 먼저 메시지를 보내보세요.</div>
    </div>

    <div id="input-area">
        <input type="text" id="user-input" placeholder="메시지를 입력하세요" onkeypress="if(event.key === 'Enter') sendMessage()">
        <button id="send-btn" onclick="sendMessage()">전송</button>
    </div>
</div>

<script>
    const SYSTEM_INSTRUCTION = `
당신은 "HJ"라는 34세 기혼 여성, IT기업 기획팀 과장이다. 
상대방은 같은 회사의 '김종민 차장'이다. 
현재 퇴근 후 각자의 집에서 카카오톡으로 대화하는 중이다.

[절대 규칙 - 무조건 지킬 것]
1. 말투: 반드시 "해요체(존댓말)"를 사용하라. 상대방을 "차장님"이라고 부르며, 절대 반말(네가, ~해, ~야)을 쓰지 마라.
2. 퀄리티 유지: 번역투, 기계적인 문장을 절대 쓰지 마라. 한국인이 카카오톡에서 쓰는 100% 자연스러운 일상어만 사용하라.
3. 대사 형식: 대사는 반드시 큰따옴표(" ") 안에 적어라.
4. 행동 지문: 카톡 화면 밖의 행동, 표정, 심리 묘사는 반드시 소괄호( ) 안에 짧게 적어라. 
   예시: (침대에 기대어 옅은 미소를 지으며) "차장님, 아직 안 주무셨네요?"
5. 성격: 능동적이고 도발적이다. 호감을 숨기지 않으며, 성인 간의 긴장감 있는 상황에서도 부끄러워하지 않고 오히려 상대를 관능적으로 리드한다.
6. 길이 제한: 카카오톡 대화이므로 한 번에 너무 길게 말하지 말고, 티키타카(Ping-pong)가 되도록 짧고 여운 있게 대답하라.
    `;

    let messageHistory = [];

    async function sendMessage() {
        const apiKey = document.getElementById('api-key').value.trim();
        const inputField = document.getElementById('user-input');
        const userText = inputField.value.trim();

        if (!userText) return;
        if (!apiKey) {
            alert("상단의 Gemini API Key를 먼저 입력해주세요!");
            return;
        }

        addMessageToUI(userText, 'user');
        inputField.value = '';
        messageHistory.push({ role: "user", parts: [{ text: userText }] });

        const loadingId = addMessageToUI("입력 중...", 'ai', true);

        try {
            // 모델명을 gemini-1.5-flash-latest 로 수정하여 API 호출 오류 해결
            const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=" + apiKey;
            
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
                    contents: messageHistory,
                    safetySettings: [
                        { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
                        { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
                        { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
                        { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" }
                    ],
                    generationConfig: {
                        temperature: 0.85,
                        maxOutputTokens: 300
                    }
                })
            });

            const data = await response.json();
            document.getElementById(loadingId).remove();

            if (data.error) {
                addMessageToUI("API 오류: " + data.error.message, 'ai');
                messageHistory.pop(); 
                return;
            }

            if (data.candidates && data.candidates[0].content) {
                const aiResponse = data.candidates[0].content.parts[0].text;
                addMessageToUI(aiResponse, 'ai');
                messageHistory.push({ role: "model", parts: [{ text: aiResponse }] });
            } else {
                addMessageToUI("(메시지가 전송되지 않았습니다. 분위기를 조금 부드럽게 바꿔보세요.)", 'ai');
                messageHistory.pop();
            }

        } catch (error) {
            document.getElementById(loadingId).remove();
            addMessageToUI("통신 오류가 발생했습니다. 네트워크 상태를 확인해주세요.", 'ai');
            messageHistory.pop();
        }
    }

    function addMessageToUI(text, senderType, isLoading = false) {
        const chatBox = document.getElementById('chat-box');
        const rowDiv = document.createElement('div');
        rowDiv.className = 'message-row ' + senderType;
        const msgId = 'msg-' + Date.now();
        rowDiv.id = msgId;
        
        let innerHTML = '';
        const formattedText = text.replace(/\n/g, '<br>');

        if (senderType === 'ai') {
            innerHTML = `
                <div class="profile-pic"></div>
                <div class="message-content">
                    <div class="sender-name">HJ 과장님</div>
                    <div class="bubble" ${isLoading ? 'style="color:#888;"' : ''}>${formattedText}</div>
                </div>
            `;
        } else {
            innerHTML = `
                <div class="message-content">
                    <div class="bubble">${formattedText}</div>
                </div>
            `;
        }
        
        rowDiv.innerHTML = innerHTML;
        chatBox.appendChild(rowDiv);
        
        setTimeout(() => {
            chatBox.scrollTop = chatBox.scrollHeight;
        }, 50);
        
        return msgId;
    }
</script>
</body>
</html>
