<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>카카오톡 - HJ 과장님</title>
    <style>
        body { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; background-color: #e0e0e0; margin: 0; display: flex; justify-content: center; height: 100vh; }
        .mobile-container { width: 100%; max-width: 450px; height: 100vh; background-color: #b2c7d9; display: flex; flex-direction: column; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        
        #api-key-area { background: #2c3e50; padding: 8px; text-align: center; font-size: 11px; color: #fff; z-index: 10; display: flex; justify-content: center; align-items: center; gap: 5px; }
        #api-key-area input { padding: 4px; width: 170px; border-radius: 4px; border: none; font-size: 11px; }
        #api-key-area button { padding: 3px 8px; background: #f1c40f; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 11px; color: #333; }

        .header { background-color: #b2c7d9; padding: 15px; font-weight: bold; text-align: center; font-size: 16px; border-bottom: 1px solid rgba(0,0,0,0.05); color: #333; display: flex; justify-content: space-between; align-items: center; }
        .header .title { flex: 1; text-align: center; }

        #chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .system-msg { background-color: rgba(0,0,0,0.1); color: #fff; font-size: 12px; padding: 5px 15px; border-radius: 15px; align-self: center; margin-bottom: 10px; text-align: center; }

        .message-row { display: flex; width: 100%; align-items: flex-start; }
        .message-row.ai { flex-direction: row; }
        .message-row.user { flex-direction: row-reverse; }

        .profile-pic { width: 40px; height: 40px; border-radius: 15px; background-color: #fff; margin-right: 10px; margin-left: 10px; background-image: url('https://cdn-icons-png.flaticon.com/512/4140/4140047.png'); background-size: cover; flex-shrink: 0; }
        .user .profile-pic { display: none; }

        .message-content { max-width: 70%; display: flex; flex-direction: column; }
        .user .message-content { align-items: flex-end; }
        
        .sender-name { font-size: 12px; color: #555; margin-bottom: 4px; margin-left: 2px; }
        .user .sender-name { display: none; }

        .bubble { padding: 10px 12px; border-radius: 12px; font-size: 14px; line-height: 1.5; word-wrap: break-word; position: relative; }
        .ai .bubble { background-color: #ffffff; border-top-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .user .bubble { background-color: #FEE500; border-top-right-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }

        #input-area { display: flex; padding: 10px; background-color: #ffffff; border-top: 1px solid #e0e0e0; }
        #user-input { flex: 1; padding: 12px; border: none; background-color: #f5f5f5; border-radius: 20px; outline: none; font-size: 14px; margin-right: 10px; }
        #send-btn { padding: 0 20px; background-color: #FEE500; color: #333; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

<div class="mobile-container">
    <div id="api-key-area">
        Gemini Key: <input type="password" id="api-key" placeholder="AIza로 시작하는 키">
        <button onclick="saveKey()">임시 저장</button>
    </div>
    
    <div class="header">
        <span class="title">HJ 과장님</span>
    </div>

    <div id="chat-box">
        <div class="system-msg" id="status-msg">상단에 제미나이 API 키를 입력하고 [임시 저장]을 눌러주세요.</div>
        <div class="message-row ai">
            <div class="profile-pic"></div>
            <div class="message-content">
                <div class="sender-name">HJ 과장님</div>
                <div class="bubble" id="first-msg">
                    (침대에 기대어 스마트폰을 바라보다가 옅은 미소를 지으며) "차장님, 아직 안 주무셨네요? 마침 저도 혼자 심심했는데 잘 됐네."
                </div>
            </div>
        </div>
    </div>

    <div id="input-area">
        <input type="text" id="user-input" placeholder="메시지를 입력하세요" onkeypress="if(event.key === 'Enter') sendMessage()">
        <button id="send-btn" onclick="sendMessage()">전송</button>
    </div>
</div>

<script>
    // 개선 1: sessionStorage 사용 및 창 종료 시 키 삭제 (보안 완화)
    window.onload = function() {
        const savedKey = sessionStorage.getItem('temp_gemini_key');
        if (savedKey) {
            document.getElementById('api-key').value = savedKey;
            document.getElementById('status-msg').innerText = "연결 준비 완료. 대화를 시작하세요.";
        }
    };

    window.addEventListener('beforeunload', function() {
        sessionStorage.removeItem('temp_gemini_key');
    });

    function saveKey() {
        const key = document.getElementById('api-key').value.trim();
        if (key) {
            sessionStorage.setItem('temp_gemini_key', key);
            document.getElementById('status-msg').innerText = "제미나이 키 임시 저장 완료! (창 닫으면 삭제됨)";
            alert('키가 세션에 저장되었습니다. 창을 닫으면 사라집니다.');
        } else {
            alert('키를 입력해주세요.');
        }
    }

    const SYSTEM_INSTRUCTION = `
당신은 "HJ"라는 34세 기혼 여성, IT기업 기획팀 과장이다. 상대방은 '김종민 차장'이다.
[절대 규칙]
1. 말투: 반드시 "해요체(존댓말)"를 사용하고 상대방을 "차장님"이라 불러라. 절대 반말을 쓰지 마라.
2. 형식: 대사는 큰따옴표(" ") 안에, 행동/심리 묘사는 소괄호( ) 안에 작성하라.
3. 성격: 능동적이고 도발적이며 유혹적인 플러팅을 즐긴다. 
4. 출력 완성도: 답변을 중간에 끊거나 미완성 상태로 두지 말고, 반드시 문장과 의미를 온전히 끝맺어 출력하라.
    `;

    let chatHistory = [];
    let isWaitingForResponse = false; // 중복 전송 방지 플래그

    async function sendMessage() {
        if (isWaitingForResponse) return;

        const apiKey = document.getElementById('api-key').value.trim() || sessionStorage.getItem('temp_gemini_key');
        const inputField = document.getElementById('user-input');
        const userText = inputField.value.trim();

        if (!userText) return;
        if (!apiKey) {
            alert("상단에 Gemini API 키를 입력하고 [임시 저장]을 눌러주세요!");
            return;
        }

        isWaitingForResponse = true;
        addMessageToUI(userText, 'user');
        inputField.value = '';

        chatHistory.push({ role: "user", parts: [{ text: userText }] });
        const loadingId = addMessageToUI("입력 중...", 'ai', true);

        try {
            // 개선 3: API 통신 로직 분리 및 재시도/정합성 관리
            const aiResponseText = await fetchAIResponse(apiKey, chatHistory);
            
            document.getElementById(loadingId).remove();
            addMessageToUI(aiResponseText, 'ai');
            chatHistory.push({ role: "model", parts: [{ text: aiResponseText }] });
            
        } catch (error) {
            document.getElementById(loadingId).remove();
            addMessageToUI("오류 발생: " + error.message, 'ai');
            chatHistory.pop(); // 에러 시 한 번만 히스토리 롤백
        } finally {
            isWaitingForResponse = false;
        }
    }

    async function fetchAIResponse(apiKey, history) {
        // 개선 4: 정확한 최신 권장 모델명 사용 (gemini-1.5-flash)
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
        
        for (let attempt = 1; attempt <= 3; attempt++) {
            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        system_instruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
                        contents: history,
                        safetySettings: [
                            { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
                            { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
                            { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
                            { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" }
                        ],
                        generationConfig: {
                            temperature: 0.85,
                            maxOutputTokens: 800 
                        }
                    })
                });

                const data = await response.json();

                if (response.ok && data.candidates && data.candidates[0].content) {
                    return data.candidates[0].content.parts[0].text;
                }

                if (data.error) {
                    if (data.error.code === 503 && attempt < 3) {
                        await new Promise(r => setTimeout(r, 1000));
                        continue;
                    }
                    throw new Error(data.error.message);
                }
                throw new Error("올바르지 않은 API 응답 형식");

            } catch (err) {
                if (attempt === 3) {
                    throw new Error(err.message || "통신 오류가 발생했습니다.");
                }
                await new Promise(r => setTimeout(r, 1000));
            }
        }
    }

    // 개선 2: XSS 방지를 위한 안전한 텍스트 렌더링 함수
    function createSafeTextNodes(text, container) {
        const lines = text.split('\n');
        lines.forEach((line, index) => {
            if (line) {
                container.appendChild(document.createTextNode(line));
            }
            if (index < lines.length - 1) {
                container.appendChild(document.createElement('br'));
            }
        });
    }

    function addMessageToUI(text, senderType, isLoading = false) {
        const chatBox = document.getElementById('chat-box');
        const rowDiv = document.createElement('div');
        rowDiv.className = 'message-row ' + senderType;
        const msgId = 'msg-' + Date.now();
        rowDiv.id = msgId;

        // 컨테이너 요소들 생성
        const contentDiv = document.createElement('div');
        contentDiv.className = 'message-content';

        const bubbleDiv = document.createElement('div');
        bubbleDiv.className = 'bubble';
        if (isLoading) bubbleDiv.style.color = '#888';

        // 텍스트를 안전하게 삽입
        createSafeTextNodes(text, bubbleDiv);

        if (senderType === 'ai') {
            const profilePic = document.createElement('div');
            profilePic.className = 'profile-pic';
            
            const senderName = document.createElement('div');
            senderName.className = 'sender-name';
            senderName.textContent = 'HJ 과장님';

            contentDiv.appendChild(senderName);
            contentDiv.appendChild(bubbleDiv);

            rowDiv.appendChild(profilePic);
            rowDiv.appendChild(contentDiv);
        } else {
            contentDiv.appendChild(bubbleDiv);
            rowDiv.appendChild(contentDiv);
        }
        
        chatBox.appendChild(rowDiv);
        
        setTimeout(() => {
            chatBox.scrollTop = chatBox.scrollHeight;
        }, 50);
        
        return msgId;
    }
</script>
</body>
</html>
